<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StarGate9</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080a0f;
      --panel: #10141d;
      --text: #eef2f7;
      --muted: #a8b0bd;
      --line: rgba(255, 255, 255, .12);
      --accent: #f4f5f7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, .08), transparent 34rem),
        linear-gradient(135deg, #050608, #0c1017 58%, #020305);
      color: var(--text);
      font: 16px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(720px, 100%);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2.25rem, 7vw, 4.5rem);
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 22px;
      color: var(--muted);
      max-width: 58ch;
    }

    .install {
      display: grid;
      gap: 12px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(16, 20, 29, .76);
      box-shadow: 0 22px 70px rgba(0, 0, 0, .38);
    }

    code {
      display: block;
      overflow-wrap: anywhere;
      padding: 14px;
      border-radius: 6px;
      background: #05070b;
      border: 1px solid var(--line);
      color: var(--accent);
    }

    a {
      color: var(--accent);
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
    }
  </style>
</head>
<body>
  <main>
    <h1>StarGate9</h1>
    <p>Hosted custom profile stylesheet package with a clean install entrypoint.</p>
    <section class="install" aria-label="Install">
      <a href="StarGate9.css">Open StarGate9.css</a>
      <code>@import url("https://stargate9-e0d0e1.gitlab.io/StarGate9.css");</code>
    </section>
  </main>
</body>
</html>
